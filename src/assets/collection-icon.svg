<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background -->
  <rect width="256" height="256" fill="none"/>

  <!-- Black strokes, rounded corners -->
  <g stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-left (taller) -->
    <rect x="40" y="32" width="72" height="88" rx="16" ry="16"/>
    <!-- Top-right (shorter) -->
    <rect x="144" y="32" width="72" height="72" rx="16" ry="16"/>
    <!-- Bottom-left (shorter) -->
    <rect x="40" y="152" width="72" height="72" rx="16" ry="16"/>
    <!-- Bottom-right (nudged down to align with bottom-left) -->
    <rect x="144" y="140" width="72" height="84" rx="16" ry="16"/>
  </g>
</svg>